<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Playground</title>
    <meta
      name="description"
      content="Interactive, parameter-driven visualizations of classic results in probability, chaos, and number theory."
    />
    <!-- The faceplate colour, --surface. The dark scheme is opt-in through the
         masthead toggle rather than prefers-color-scheme, so there is one value. -->
    <meta name="theme-color" content="#d6ddd8" />
    <link rel="icon" href="/math_playground/icon.svg" type="image/svg+xml" />

    <!-- Archivo for words, Martian Mono for measurements. The axis ranges are
         trimmed to what theme.css actually asks for; display=swap keeps text
         visible while they load, and main.ts awaits the mono face before the
         first canvas paint so in-canvas labels are never left in a fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,87..125,400..800;1,100,400&family=Martian+Mono:wdth,wght@87.5..100,300..500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Math Playground renders its visualizations with JavaScript, which is currently disabled.</noscript>
    <!-- The stylesheet is imported by main.ts, so Vite hashes and inlines it
         with the bundle; there is no second render-blocking request here. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
