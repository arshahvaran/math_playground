<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Math Playground">
  <!-- The same figure the masthead draws (src/ui/shell.ts, siteMark). A favicon
       is fetched as its own document and cannot read a custom property, so the
       colours here are the literals of the app's dark scheme: the tile is dark
       in both schemes, #818c92 for the pegs (the tick token) and #ef5b33 for
       the stream, the ball and the bell (the accent). The #333a3e ring is the
       line token's dark value, and it is what keeps the tile from disappearing
       into a dark browser tab strip.

       No token NAME is written in this comment. XML forbids two hyphens inside
       one, so a CSS custom property spelled out here makes the whole file
       unparseable and the favicon silently stops rendering. -->
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="#15181b" stroke="#333a3e"/>
  <g fill="#818c92">
    <circle cx="8" cy="11.5" r="1.5"/><circle cx="16" cy="11.5" r="1.5"/><circle cx="24" cy="11.5" r="1.5"/>
    <circle cx="12" cy="17.5" r="1.5"/><circle cx="20" cy="17.5" r="1.5"/>
  </g>
  <path d="M4.5 28h23" fill="none" stroke="#818c92" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M16 4v4.5" fill="none" stroke="#ef5b33" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="13.5" cy="14.6" r="1.5" fill="#ef5b33"/>
  <path d="M5 28C10 28 11 21 16 21s6 7 11 7"
        fill="none" stroke="#ef5b33" stroke-width="1.8" stroke-linecap="round"/>
</svg>
